<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="monospace">
  <style>
    .box { rx: 8; ry: 8; stroke-width: 2; }
    .label { font-size: 13px; fill: #fff; font-weight: bold; text-anchor: middle; }
    .sublabel { font-size: 10px; fill: #ccc; text-anchor: middle; }
    .arrow { stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .flow1 { animation: flow 3s linear infinite; }
    .flow2 { animation: flow 3s linear 1s infinite; }
    .flow3 { animation: flow 3s linear 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    .data-dot { animation: travel 2.5s ease-in-out infinite; }
    .data-dot2 { animation: travel 2.5s ease-in-out 0.8s infinite; }
    .data-dot3 { animation: travel2 3s ease-in-out infinite; }
    @keyframes travel {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(200px, 0); opacity: 0; }
    }
    @keyframes travel2 {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(0, 130px); opacity: 0; }
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0f1f33"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1f4e"/><stop offset="100%" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4e3d"/><stop offset="100%" stop-color="#0f2a1f"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e3a1f"/><stop offset="100%" stop-color="#2a1f0f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0d1117" rx="12"/>
  <text x="400" y="35" fill="#58a6ff" font-size="18" text-anchor="middle" font-weight="bold">gRPC Pipeline Architecture</text>

  <!-- Kanban Intake -->
  <rect x="30" y="70" width="160" height="90" class="box" fill="url(#g4)" stroke="#f59e0b"/>
  <text x="110" y="105" class="label">KANBAN-PMO</text>
  <text x="110" y="122" class="sublabel">Task Intake</text>
  <text x="110" y="138" class="sublabel">SQLite DB</text>
  <rect x="42" y="145" width="136" height="4" rx="2" fill="#f59e0b" opacity="0.3"/>
  <rect x="42" y="145" width="90" height="4" rx="2" fill="#f59e0b" class="pulse"/>

  <!-- Sashi CLI -->
  <rect x="30" y="200" width="160" height="90" class="box" fill="url(#g1)" stroke="#60a5fa"/>
  <text x="110" y="235" class="label">SASHI CLI</text>
  <text x="110" y="252" class="sublabel">v3.0 bash</text>
  <text x="110" y="269" class="sublabel">ollama run</text>

  <!-- MCP Tool -->
  <rect x="30" y="340" width="160" height="80" class="box" fill="url(#g2)" stroke="#a78bfa"/>
  <text x="110" y="373" class="label">MCP TOOLS</text>
  <text x="110" y="390" class="sublabel">pipe-run</text>

  <!-- gRPC Server (center) -->
  <rect x="270" y="120" width="250" height="260" class="box" fill="url(#g1)" stroke="#60a5fa" stroke-width="3"/>
  <text x="395" y="150" fill="#58a6ff" font-size="15" text-anchor="middle" font-weight="bold">gRPC Server :50051</text>

  <!-- Services inside -->
  <rect x="290" y="165" width="210" height="42" rx="6" fill="#1a2744" stroke="#3b82f6" stroke-width="1"/>
  <text x="395" y="185" class="label" font-size="11">InferenceService</text>
  <text x="395" y="198" class="sublabel">RunInference | RunInferenceUnary</text>

  <rect x="290" y="217" width="210" height="42" rx="6" fill="#1a2744" stroke="#3b82f6" stroke-width="1"/>
  <text x="395" y="237" class="label" font-size="11">FileWriterService</text>
  <text x="395" y="250" class="sublabel">WriteFiles | ReadFile</text>

  <rect x="290" y="269" width="210" height="42" rx="6" fill="#1a2744" stroke="#3b82f6" stroke-width="1"/>
  <text x="395" y="289" class="label" font-size="11">PipelineService</text>
  <text x="395" y="302" class="sublabel">RunPipeline | HealthCheck</text>

  <rect x="290" y="330" width="210" height="35" rx="6" fill="#0d1f0d" stroke="#22c55e" stroke-width="1"/>
  <text x="395" y="352" fill="#4ade80" font-size="11" text-anchor="middle">protobuf | streaming | atomic</text>

  <!-- Ollama -->
  <rect x="600" y="130" width="160" height="90" class="box" fill="url(#g3)" stroke="#22c55e"/>
  <text x="680" y="165" class="label">OLLAMA</text>
  <text x="680" y="182" class="sublabel">llama3.2 (3B)</text>
  <text x="680" y="199" class="sublabel">num_thread=2</text>

  <!-- Filesystem -->
  <rect x="600" y="260" width="160" height="80" class="box" fill="url(#g2)" stroke="#a78bfa"/>
  <text x="680" y="295" class="label">FILESYSTEM</text>
  <text x="680" y="312" class="sublabel">atomic writes</text>

  <!-- SQLite DB -->
  <rect x="600" y="380" width="160" height="80" class="box" fill="url(#g4)" stroke="#f59e0b"/>
  <text x="680" y="413" class="label">SQLITE DB</text>
  <text x="680" y="430" class="sublabel">history.db (WAL)</text>

  <!-- Arrows: Kanban to gRPC -->
  <path d="M190,115 L270,200" class="arrow flow1" stroke="#f59e0b" stroke-dasharray="5,5"/>
  <circle cx="190" cy="115" r="4" fill="#f59e0b" class="data-dot"/>

  <!-- Arrows: Sashi to gRPC -->
  <path d="M190,245 L270,250" class="arrow flow2" stroke="#60a5fa" stroke-dasharray="5,5"/>
  <circle cx="190" cy="245" r="4" fill="#60a5fa" class="data-dot"/>

  <!-- Arrows: MCP to gRPC -->
  <path d="M190,375 L270,310" class="arrow flow3" stroke="#a78bfa" stroke-dasharray="5,5"/>
  <circle cx="190" cy="375" r="4" fill="#a78bfa" class="data-dot2"/>

  <!-- Arrows: gRPC to Ollama -->
  <path d="M520,186 L600,175" class="arrow flow1" stroke="#22c55e" stroke-dasharray="5,5"/>

  <!-- Arrows: gRPC to Filesystem -->
  <path d="M520,238 L600,300" class="arrow flow2" stroke="#a78bfa" stroke-dasharray="5,5"/>

  <!-- Arrows: gRPC to DB -->
  <path d="M520,290 L600,410" class="arrow flow3" stroke="#f59e0b" stroke-dasharray="5,5"/>

  <!-- Animated data dots on right side -->
  <circle cx="520" cy="186" r="3" fill="#22c55e" class="data-dot"/>
  <circle cx="395" cy="165" r="3" fill="#60a5fa" class="data-dot3"/>

  <!-- Footer -->
  <text x="400" y="480" fill="#484f58" font-size="10" text-anchor="middle">CPU-only | i7-6500U | 2 threads | zero cloud | fully offline</text>
</svg>
