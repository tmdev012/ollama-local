version: "3.8"
services:
  slow-server:
    image: alpine
    command: ["sh", "-c", "echo 'server: sleeping 5s...' && sleep 5 && echo 'server: READY' && sleep 999"]
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep sleep"]
      interval: 2s
      timeout: 2s
      retries: 5
  client-fixed:
    image: alpine
    depends_on:
      slow-server:
        condition: service_healthy
    command: ["sh", "-c", "ping -c 1 slow-server && echo 'GOT RESPONSE - race condition eliminated'"]
