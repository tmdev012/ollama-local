name: Ecosystem Integration

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ollama-local

      - name: Checkout kanban-pmo
        uses: actions/checkout@v4
        with:
          repository: tmdev012/kanban-pmo
          path: kanban-pmo

      - name: Validate shared DB schema compatibility
        run: |
          echo "=== ollama-local DB ==="
          ls ollama-local/db/ || true
          echo "=== kanban-pmo DB symlink target ==="
          ls kanban-pmo/db/ || true
          echo "=== Schema files ==="
          find . -name 'schema.sql' -exec echo {} \; -exec head -5 {} \;

      - name: Validate sashi CLI consistency
        run: |
          echo "=== ollama-local sashi version ==="
          grep -m1 'v[0-9]' ollama-local/sashi || true
          echo "=== kanban-pmo sashi version ==="
          grep -m1 'v[0-9]' kanban-pmo/sashi 2>/dev/null || echo "No sashi in kanban-pmo"

      - name: Validate Docker compose compatibility
        run: |
          for repo in ollama-local kanban-pmo; do
            echo "=== $repo docker ==="
            if [ -f "$repo/docker-compose.yml" ]; then
              docker compose -f "$repo/docker-compose.yml" config --quiet && echo "  Valid" || echo "  Invalid"
            elif [ -f "$repo/docker-compose.yaml" ]; then
              docker compose -f "$repo/docker-compose.yaml" config --quiet && echo "  Valid" || echo "  Invalid"
            fi
          done

      - name: Validate no conflicting ports
        run: |
          echo "Checking for port conflicts across repos..."
          PORTS=$(grep -rh 'ports:' -A2 */docker-compose* 2>/dev/null | grep -oP '\d+(?=:)' | sort)
          DUPES=$(echo "$PORTS" | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "WARNING: Duplicate ports: $DUPES"
          else
            echo "OK: No port conflicts"
          fi

      - name: Validate shared volume names
        run: |
          echo "Volume names across repos:"
          grep -rh 'name:' */docker-compose* 2>/dev/null | grep -v '#' | sort
