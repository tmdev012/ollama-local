name: ShellCheck

on:
  push:
    branches: [main, develop]
    paths: ['**/*.sh', 'sashi']
  pull_request:
    branches: [main]
    paths: ['**/*.sh', 'sashi']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          echo "=== Checking sashi ==="
          shellcheck -x -s bash sashi || true
          echo "=== Checking scripts/ ==="
          find scripts/ -name '*.sh' -exec shellcheck -x -s bash {} + || true
          echo "=== Checking install.sh ==="
          shellcheck -x -s bash install.sh || true
