name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -x --severity=error sashi scripts/*.sh

      - name: Python syntax check
        run: python3 -m py_compile scripts/init-db.py

      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check
