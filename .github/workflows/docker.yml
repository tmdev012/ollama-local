name: Docker

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'docker-compose.yaml', 'docker-compose.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t ollama-local:test .
      - name: Validate compose config
        run: docker compose config -q 2>/dev/null || true
